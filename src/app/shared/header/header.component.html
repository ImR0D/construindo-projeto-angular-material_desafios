<div class="container">
  <div class="content">
    <div class="logo">
      <img
        class="jm-logo"
        src="logos/white_logo.png"
        alt="logo do jornada milhas"
      />
    </div>
    <div class="menu">
      <div class="links">
        <ul>
          <li><button>Vender milhas</button></li>
          <li><button>Sobre</button></li>
        </ul>
      </div>
      <div class="user">
        <div class="register-or-Login">
          @if (!currentUser()) {
            <button class="primary-btn">Cadastre-se</button>
          } @else {
            <button class="user-circle">
              <img src="icons/user_circle_icon.png" />
            </button>
          }
          @if (!currentUser()) {
            <button class="secondary-btn" (click)="openLoginDialog()">
              Login
            </button>
          } @else {
            <button class="secondary-btn" (click)="logout()">Logout</button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
